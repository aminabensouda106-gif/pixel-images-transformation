[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelshift"
version = "0.0.1"
description = "Rebuild one picture using only the pixels of another."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pillow>=10", "scipy>=1.11",
  "numba>=0.60",
  "typer>=0.12",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
]

[project.scripts]
pixelshift = "pixelshift.cli:app"

[project.optional-dependencies]
gpu = ["moderngl>=5.8", "glfw>=2.6"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "scipy-stubs"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["glfw", "moderngl"]
ignore_missing_imports = true
